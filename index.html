<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sobremesa Café</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">
  <link rel="stylesheet" href="base.css">
</head>
<body class="landing-screen">
  <main class="landing-wrap">
    <div class="landing-brand">
      <span class="landing-name">SOBREMESA</span>
      <span class="landing-tag">CAFÉ</span>
    </div>
    <a class="landing-continue" href="home.html" aria-label="Click to continue to Sobremesa Café">
      <span class="landing-dots" aria-hidden="true"><i></i><i></i><i></i></span>
      <span class="landing-action">Click to continue</span>
    </a>
  </main>
  <script>
    const continueLink = document.querySelector(".landing-continue");
    const reduceMotion = window.matchMedia("(prefers-reduced-motion: reduce)").matches;

    if (continueLink && !reduceMotion) {
      continueLink.addEventListener("click", (event) => {
        event.preventDefault();
        try {
          sessionStorage.setItem("sobremesa-home-entry", "yes");
        } catch {}
        document.body.classList.add("landing-leaving");
        window.setTimeout(() => window.location.assign(continueLink.href), 340);
      });
    }
  </script>
</body>
</html>
