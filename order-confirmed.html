<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<body data-page="orders">
<div class="app">

  <main class="app-main confirm-main">
    <div class="confirm-check"><i class="fa-solid fa-check"></i></div>
    <h1 class="confirm-title">Order Placed!</h1>
    <p class="confirm-sub">Your order has been successfully submitted. Please present this order number to the cashier for payment.</p>

    <div class="order-number-card">
      <span>Order Number</span>
      <p id="order-number">#0000</p>
    </div>

    <p class="confirm-meta" id="confirm-meta"></p>

    <div class="confirm-actions">
      <a class="btn-outline" id="view-details-link" href="#">View Order Details</a>
      <a class="hero-cta" href="index.html">Back to Home</a>
    </div>
  </main>

</div>

<script src="menu-data.js"></script>
<script src="app.js"></script>
<script src="order-confirmed.js"></script>
